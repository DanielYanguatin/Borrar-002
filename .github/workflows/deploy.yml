name: CI-Angular

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Inicio de sesion en el repositorio
        run: |
          echo "Hola mundo 1"
          echo "Hola mundo 2"

      - name: Clonar repositorio
        uses: actions/checkout@v2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI

      - name: Finalizacion del trabajo
        run: echo "Proceso finalizado correctamente"